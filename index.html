<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dossier de défense — documents</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      color: #222;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px 20px;
      padding: 12px 20px;
      background: #243447;
      color: white;
    }

    .topbar h1 {
      flex: 0 0 auto;
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    .navigation {
      display: flex;
      flex: 1 1 auto;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .navigation button {
      padding: 8px 12px;
      border: 1px solid #718096;
      border-radius: 4px;
      background: transparent;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    .navigation button:hover,
    .navigation button[aria-current="page"] {
      background: white;
      color: #243447;
    }

    .optionsbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      border-bottom: 1px solid #c8cdd3;
      background: #e3e8ed;
    }

    .optionsbar-label {
      margin-right: auto;
      color: #445;
      font-size: 14px;
    }

    .optionsbar button {
      padding: 7px 10px;
      border: 1px solid #718096;
      border-radius: 4px;
      background: white;
      color: #243447;
      font: inherit;
      cursor: pointer;
    }

    .optionsbar button:hover {
      background: #243447;
      color: white;
    }

    .commentaire {
      flex: 0 0 auto;
      width: 100%;
      min-height: 90px;
      padding: 12px 20px;
      border: 0;
      border-bottom: 1px solid #c8cdd3;
      background: #f1f3f5;
      color: #222;
      font: inherit;
      resize: vertical;
    }

    iframe {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      border: 0;
      background: white;
    }

    @media (max-width: 700px) {
      .navigation {
        justify-content: flex-start;
      }

      .optionsbar {
        flex-wrap: wrap;
      }

      .optionsbar-label {
        flex-basis: 100%;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <h1>Dossier de défense</h1>
    <nav
      id="document-menu"
      class="navigation"
      aria-label="Navigation des documents"
    ></nav>
  </header>

  <div class="optionsbar">
    <span class="optionsbar-label">Options de sauvegarde :</span>
    <button id="exporter" type="button">Exporter JSON</button>
    <button id="importer" type="button">Importer JSON</button>
    <input
      id="fichier-import"
      type="file"
      accept=".json,application/json"
      hidden
    >
  </div>

  <textarea
    id="commentaire"
    class="commentaire"
    aria-label="Commentaire sur le document"
    placeholder="Saisissez votre commentaire pour ce document…"
  ></textarea>

  <iframe id="document-frame" title="Document sélectionné"></iframe>

  <script>
    // Pour ajouter ou retirer une page, modifiez uniquement cette liste.
    // Les fichiers doivent se trouver dans le même dossier que index.html.
    const DOCUMENTS = [
      {
        fichier: "expose-demande.html",
        titre: "Ma demande",
        commentaire: ""
      },
      {
        fichier: "harcèlement_moral_au_travail.pdf",
        titre: "Harcèlement au travail",
        commentaire: ""
      },
      {
        fichier: "Harcèlement_moral_LIENS.html",
        titre: "Harcèlement liens",
        commentaire: ""
      },
      {
        fichier: "reproches-arguments.html",
        titre: "ARGUMENTS",
        commentaire: ""
      },
      {
        fichier: "Protection_contre_les_représailles-Loi_bien-être_Securex.pdf",
        titre: "Protection contre les représailles — Securex",
        commentaire: ""
      }
    ];

    const CLE_STOCKAGE = "dossier-defense-commentaires";

    window.addEventListener("DOMContentLoaded", function () {
      const menu = document.getElementById("document-menu");
      const cadre = document.getElementById("document-frame");
      const zoneCommentaire = document.getElementById("commentaire");
      const boutonExporter = document.getElementById("exporter");
      const boutonImporter = document.getElementById("importer");
      const fichierImport = document.getElementById("fichier-import");

      let commentaires = {};

      try {
        commentaires = JSON.parse(localStorage.getItem(CLE_STOCKAGE)) || {};
      } catch (erreur) {
        commentaires = {};
      }

      let indexActif = 0;

      function sauvegarderDansNavigateur() {
        try {
          localStorage.setItem(CLE_STOCKAGE, JSON.stringify(commentaires));
        } catch (erreur) {
          // L'export JSON reste disponible si le stockage local est indisponible.
        }
      }

      function afficherDocument(index) {
        indexActif = index;
        const doc = DOCUMENTS[index];

        cadre.src = new URL(doc.fichier, window.location.href).href;
        cadre.title = doc.titre;
        zoneCommentaire.value =
          commentaires[doc.fichier] ?? doc.commentaire;

        menu.querySelectorAll("button").forEach(function (bouton, boutonIndex) {
          if (boutonIndex === index) {
            bouton.setAttribute("aria-current", "page");
          } else {
            bouton.removeAttribute("aria-current");
          }
        });
      }

      DOCUMENTS.forEach(function (doc, index) {
        const bouton = document.createElement("button");
        bouton.type = "button";
        bouton.textContent = doc.titre;

        bouton.addEventListener("click", function () {
          afficherDocument(index);
        });

        menu.appendChild(bouton);
      });

      zoneCommentaire.addEventListener("input", function () {
        const doc = DOCUMENTS[indexActif];
        commentaires[doc.fichier] = zoneCommentaire.value;
        sauvegarderDansNavigateur();
      });

      boutonExporter.addEventListener("click", function () {
        const sauvegarde = {
          version: 1,
          dateExport: new Date().toISOString(),
          commentaires: commentaires
        };

        const blob = new Blob(
          [JSON.stringify(sauvegarde, null, 2)],
          { type: "application/json;charset=utf-8" }
        );

        const lien = document.createElement("a");
        const url = URL.createObjectURL(blob);

        lien.href = url;
        lien.download = "sauvegarde-commentaires-dossier.json";
        lien.click();

        URL.revokeObjectURL(url);
      });

      boutonImporter.addEventListener("click", function () {
        fichierImport.click();
      });

      fichierImport.addEventListener("change", async function () {
        const fichier = fichierImport.files[0];
        if (!fichier) return;

        try {
          const contenu = await fichier.text();
          const donnees = JSON.parse(contenu);
          const commentairesImportes = donnees.commentaires || donnees;

          if (
            !commentairesImportes ||
            typeof commentairesImportes !== "object" ||
            Array.isArray(commentairesImportes)
          ) {
            throw new Error("Format JSON incorrect");
          }

          DOCUMENTS.forEach(function (doc) {
            if (typeof commentairesImportes[doc.fichier] === "string") {
              commentaires[doc.fichier] = commentairesImportes[doc.fichier];
            }
          });

          sauvegarderDansNavigateur();
          afficherDocument(indexActif);
          alert("Les commentaires ont été importés.");
        } catch (erreur) {
          alert("Impossible d’importer ce fichier JSON.");
        }

        fichierImport.value = "";
      });

      if (DOCUMENTS.length > 0) {
        afficherDocument(0);
      }
    });
  </script>
</body>
</html>
